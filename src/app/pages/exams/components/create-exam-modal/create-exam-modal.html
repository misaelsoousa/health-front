<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4" (click)="close.emit()">
    <section class="w-full max-w-3xl overflow-hidden rounded-xl bg-white shadow-2xl" (click)="$event.stopPropagation()">
        <header class="flex items-center justify-between bg-main-green px-6 py-4">
            <div>
                <h2 class="text-xl font-bold text-white">Novo Exame</h2>
                <p class="text-sm font-semibold text-white/80">Preencha os dados para criar o registro</p>
            </div>
            <button
                type="button"
                class="flex h-10 w-10 items-center justify-center rounded-full border border-white/40 text-white transition duration-300 hover:bg-white hover:text-main-green cursor-pointer"
                (click)="close.emit()">
                <app-close-icon></app-close-icon>
            </button>
        </header>

        <form #examForm="ngForm" class="flex flex-col gap-5 p-6" (ngSubmit)="submit()">
            @if (error) {
                <div class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 font-semibold text-red-700">
                    {{ error }}
                </div>
            }

            <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-main-blue">CPF do paciente</label>
                    <input
                        type="text"
                        name="patientCpf"
                        required
                        appCpfValidator
                        [maskito]="cpfMask"
                        placeholder="000.000.000-00"
                        #cpfField="ngModel"
                        class="rounded-lg border border-main-blue/10 bg-white px-4 py-3 outline-none transition focus:border-main-green"
                        [(ngModel)]="form.patientCpf">
                    @if (cpfField.touched && cpfField.errors?.['required']) {
                        <span class="text-sm font-semibold text-red-600">CPF é obrigatório.</span>
                    }
                    @if (cpfField.touched && cpfField.errors?.['cpfInvalid']) {
                        <span class="text-sm font-semibold text-red-600">CPF inválido.</span>
                    }
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-main-blue">Modalidade</label>
                    <div class="relative">
                        <select
                            name="modality"
                            required
                            class="rounded-lg border border-main-blue/10 bg-white px-4 py-3 pr-10 outline-none appearance-none transition focus:border-main-green w-full"
                            [(ngModel)]="form.modality">
                            @for (modality of modalityOptions; track modality.value) {
                                <option [ngValue]="modality.value">{{ modality.label }}</option>
                            }
                        </select>
                        <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-main-blue/60">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="m6 9 6 6 6-6"></path>
                            </svg>
                        </span>
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-main-blue">Descricao</label>
                    <input
                        type="text"
                        name="descricao"
                        required
                        class="rounded-lg border border-main-blue/10 bg-white px-4 py-3 outline-none transition focus:border-main-green"
                        [(ngModel)]="form.descricao">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-main-blue">Data do exame</label>
                    <input
                        type="date"
                        name="examDate"
                        required
                        class="rounded-lg border border-main-blue/10 bg-white px-4 py-3 outline-none transition focus:border-main-green"
                        [(ngModel)]="form.examDate">
                </div>
            </div>

            <div class="flex flex-col gap-3 border-t border-black/10 pt-5 md:flex-row md:justify-end">
                <button
                    type="button"
                    class="rounded-full border border-main-green px-5 py-3 font-semibold text-main-green transition duration-300 hover:bg-main-green hover:text-white cursor-pointer"
                    (click)="close.emit()">
                    Cancelar
                </button>
                <button
                    type="submit"
                    class="rounded-full bg-main-blue px-5 py-3 font-semibold text-white transition duration-300 hover:bg-dark-blue disabled:cursor-not-allowed disabled:opacity-50 cursor-pointer"
                    [disabled]="examForm.invalid || isSubmitting">
                    {{ isSubmitting ? 'Salvando...' : 'Criar Exame' }}
                </button>
            </div>
        </form>
    </section>
</div>
